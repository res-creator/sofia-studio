<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#222}
#logo,#banner{position:relative;overflow:hidden}
.anton{font-family:Anton,Impact,sans-serif;letter-spacing:.02em}
.inter{font-family:Inter,sans-serif}
</style></head><body>

<!-- LOGO 800x800 -->
<div id="logo" style="width:800px;height:800px;background:#0f1d3a">
<svg width="800" height="800" viewBox="0 0 800 800">
 <defs>
  <radialGradient id="sun" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff7a2f"/><stop offset="1" stop-color="#d9431e"/></radialGradient>
 </defs>
 <circle cx="400" cy="400" r="400" fill="url(#sun)"/>
 <!-- strap -->
 <rect x="0" y="352" width="800" height="96" fill="#0f1d3a"/>
 <g stroke="#f6ead2" stroke-width="5" stroke-dasharray="18 14" fill="none" opacity=".9">
  <line x1="0" y1="368" x2="800" y2="368"/><line x1="0" y1="432" x2="800" y2="432"/></g>
 <!-- buckle -->
 <rect x="235" y="268" width="330" height="264" rx="56" fill="#f6ead2" stroke="#0f1d3a" stroke-width="18"/>
 <rect x="300" y="333" width="200" height="134" rx="22" fill="#0f1d3a"/>
 <rect x="372" y="352" width="56" height="96" rx="10" fill="#ff8a3a"/>
 <!-- plane -->
 <g transform="translate(400 170) rotate(-12) scale(1.15)" fill="#0f1d3a">
  <path d="M-70 0 C-40 -9 40 -9 72 -4 C84 -2 84 2 72 4 C40 9 -40 9 -70 0Z"/>
  <path d="M10 -6 L-24 -58 L-8 -58 L36 -6Z"/><path d="M10 6 L-24 58 L-8 58 L36 6Z"/>
  <path d="M-62 -3 L-74 -30 L-62 -30 L-44 -4Z"/><path d="M-62 3 L-74 30 L-62 30 L-44 4Z"/>
 </g>
 <text x="400" y="660" text-anchor="middle" class="anton" font-family="Anton" font-size="118" fill="#0f1d3a">BUCKLE UP</text>
</svg></div>

<!-- BANNER 2560x1440, safe area 1546x423 centered -->
<div id="banner" style="width:2560px;height:1440px">
<svg width="2560" height="1440" viewBox="0 0 2560 1440">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#0b1630"/><stop offset=".42" stop-color="#1f3a6b"/><stop offset=".62" stop-color="#e0673a"/><stop offset=".74" stop-color="#ffb35c"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
  <radialGradient id="sunb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff2c8"/><stop offset=".6" stop-color="#ffc066"/><stop offset="1" stop-color="#ffc066" stop-opacity="0"/></radialGradient>
 </defs>
 <rect width="2560" height="1440" fill="url(#sky)"/>
 <g fill="#fff" opacity=".7"><circle cx="300" cy="200" r="3"/><circle cx="620" cy="120" r="2"/><circle cx="980" cy="260" r="2.5"/><circle cx="1500" cy="150" r="2"/><circle cx="1900" cy="240" r="3"/><circle cx="2250" cy="110" r="2"/><circle cx="2400" cy="330" r="2.5"/><circle cx="160" cy="420" r="2"/><circle cx="2100" cy="420" r="2"/></g>
 <circle cx="1880" cy="980" r="330" fill="url(#sunb)"/>
 <!-- mountains / skyline silhouettes -->
 <path d="M0 1010 L180 900 L320 960 L520 820 L700 950 L860 880 L1040 990 L1200 920 L1380 1000 L1560 880 L1720 960 L1900 860 L2080 960 L2260 890 L2420 970 L2560 920 L2560 1440 L0 1440Z" fill="#7a2f3a" opacity=".55"/>
 <path d="M0 1080 L240 990 L400 1040 L620 950 L820 1060 L1000 1000 L1180 1070 L1400 990 L1600 1060 L1800 980 L2000 1060 L2200 1000 L2400 1070 L2560 1020 L2560 1440 L0 1440Z" fill="#2b1f3f"/>
 <rect y="1150" width="2560" height="290" fill="#141a33"/>
 <!-- flight path -->
 <path d="M120 470 C 700 250, 1700 230, 2330 400" fill="none" stroke="#f6ead2" stroke-width="6" stroke-dasharray="4 22" stroke-linecap="round" opacity=".85"/>
 <g fill="#ffb35c"><circle cx="120" cy="470" r="12"/></g>
 <g transform="translate(2330 402) rotate(14) scale(1.05)" fill="#f6ead2">
  <path d="M-70 0 C-40 -9 40 -9 72 -4 C84 -2 84 2 72 4 C40 9 -40 9 -70 0Z"/>
  <path d="M10 -6 L-24 -58 L-8 -58 L36 -6Z"/><path d="M10 6 L-24 58 L-8 58 L36 6Z"/>
  <path d="M-62 -3 L-74 -30 L-62 -30 L-44 -4Z"/><path d="M-62 3 L-74 30 L-62 30 L-44 4Z"/></g>
 <!-- safe area content: x 507..2053, y 508..931 -->
 <g transform="translate(1280 0)">
  <text x="0" y="530" text-anchor="middle" font-family="Inter" font-weight="800" font-size="40" letter-spacing="14" fill="#ffd38a">FASTEN YOUR SEATBELTS</text>
  <text x="0" y="790" text-anchor="middle" font-family="Anton" font-size="250" fill="#f6ead2" style="paint-order:stroke" stroke="#0b1630" stroke-width="10">BUCKLE UP</text>
  <rect x="-520" y="832" width="1040" height="78" rx="39" fill="#0b1630" opacity=".85"/>
  <text x="0" y="884" text-anchor="middle" font-family="Inter" font-weight="600" font-size="38" letter-spacing="3" fill="#f6ead2">One country at a time · 4K travel documentaries</text>
 </g>
</svg></div>
</body></html>
