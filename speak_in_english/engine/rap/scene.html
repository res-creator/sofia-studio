<!doctype html><meta charset=utf-8><style>
:root{--bg:#2e2530;--acc:#e59ab0;--sub:#a8979f;--card:#3d3340;--cb:#54485a;--dim:#4a3f4d;--q:#7c6a82;--tx:#f6efe9}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:'Inter Display','Inter',sans-serif}
#f{width:1080px;height:1920px;position:relative;overflow:hidden;background:radial-gradient(900px 700px at 50% 30%,#3a2e3d,#2e2530 70%)}
.c{position:absolute;left:0;right:0;text-align:center}
#lyr{top:250px;height:620px;display:flex;flex-direction:column;justify-content:center;gap:34px;padding:0 50px}
.ln{color:var(--tx);font-weight:900;font-size:104px;line-height:1.08;text-align:center;opacity:.28}
.ln.on{opacity:1}
.ln .w{color:#6f6073}.ln .w.s{color:var(--tx)}.ln .w.s .o{color:var(--acc)}.ln .w .o{color:#a8707f}
.ch{position:absolute;top:980px;width:420px;height:560px}
#chL{left:80px}#chR{right:80px}
.ch .face{position:absolute;left:10px;top:0;width:400px;height:400px;border-radius:50%;overflow:hidden;border:10px solid var(--cb);background:#3d3340}
.ch .face img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ch .mouth{position:absolute;border-radius:50%;background:#6b2a3a;box-shadow:inset 0 -6px 0 #4a1c28}
.ch.speak .face{border-color:var(--acc)}
.nm{position:absolute;left:0;right:0;top:430px;text-align:center;color:var(--sub);font-weight:800;font-size:46px;letter-spacing:4px}
#eq{position:absolute;left:0;right:0;top:1640px;height:200px;display:flex;justify-content:center;align-items:flex-end;gap:12px}
#eq i{width:30px;background:var(--acc);border-radius:10px;opacity:.85}
</style>
<div id=f>
<div id=lyr class=c></div>
<div class=ch id=chL><div class=face><img src="assets/hero.png"><div class=mouth id=mL></div></div><div class=nm>ALINA</div></div>
<div class=ch id=chR><div class=face><img src="assets/teacher.png"><div class=mouth id=mR></div></div><div class=nm>TEACHER</div></div>
<div id=eq></div>
</div>
<script>
const $=id=>document.getElementById(id);const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
let TL=null,MO=null;
const EQ=16;
function wrapOugh(w){return w.replace(/ough/i,m=>'<span class=o>'+m+'</span>')}
function wordsHtml(text,prog){ // prog: 0..1 how far the line has been sung
  const ws=text.split(' ');const tot=ws.reduce((a,w)=>a+w.length+1,0);let acc=0;
  return ws.map(w=>{const st=acc/tot;acc+=w.length+1;const on=prog>=st+0.001;return '<span class="w'+(on?' s':'')+'">'+wrapOugh(w)+'</span>'}).join(' ')}
window.setTL=(tl,mo)=>{TL=tl;MO=mo;const e=$('eq');e.innerHTML='';for(let k=0;k<EQ;k++)e.appendChild(document.createElement('i'))};
function mouth(el,who,t,cx,cy,w){const arr=MO[who];const i=Math.min(arr.length-1,Math.floor(t*30));const a=arr[i]||0;
  const h=3+a*20;el.style.width=w+'px';el.style.height=h+'px';el.style.left=(cx-w/2)+'px';el.style.top=(cy-h/2)+'px';el.style.opacity=a>0.04?1:0}
function render(t){
  const beatN=t/TL.beat;const ph=beatN-Math.floor(beatN);const bump=Math.max(0,1-ph*3);
  const evs=TL.ev;let cur=null;
  // active event = latest started one still within its display window (until next event or +1.2s after end)
  for(let k=0;k<evs.length;k++){const e=evs[k];if(t>=e.t-0.02)cur=e}
  let lines=[];
  if(cur){
    if(cur.kind==='rap'){const b=cur.bar;const pair=evs.filter(e=>e.kind==='rap'&&e.bar===b);
      lines=pair.map(e=>{const p=clamp((t-e.t)/(e.dur));return{html:wordsHtml(e.text,t<e.t?-1:p),on:t>=e.t&&t<e.end+0.4||(t>=e.t)}})}
    else if(cur.kind==='pair'){const b=cur.bar;const pair=evs.filter(e=>e.kind==='pair'&&e.bar===b);
      lines=pair.map(e=>({html:e.part==='word'?wrapOugh(e.text):(t>=e.t?'<span style=color:#e59ab0>'+e.text+'</span>':'?'),on:t>=e.t}))}
    else{lines=[{html:cur.text.replace(/</g,'&lt;'),on:true}]}
  } else lines=[{html:'',on:false}];
  const L=$('lyr');L.innerHTML=lines.map(l=>'<div class="ln'+(l.on?' on':'')+'">'+l.html+'</div>').join('');
  // speakers
  const sp=(who)=>evs.some(e=>e.who===who&&t>=e.t&&t<=e.end);
  $('chL').className='ch'+(sp('hero')?' speak':'');$('chR').className='ch'+(sp('teacher')?' speak':'');
  // bounce on the beat (only while beat runs) + speaking pop
  const beating=t>TL.bar*2&&t<TL.bar*(TL.total/TL.bar-1.2);const k=beating?bump:0;
  $('chL').style.transform=`translateY(${-18*k*(sp('hero')?1.6:0.6)}px) scale(${1+0.03*k})`;$('chR').style.transform=`translateY(${-18*k*(sp('teacher')?1.6:0.6)}px) scale(${1+0.03*k})`;
  mouth($("mL"),"hero",t,152+10,211+10,30);mouth($("mR"),"teacher",t,122+10,275+10,32);
  // equaliser
  [...$('eq').children].forEach((el,i)=>{const on=beating;const v=on?(0.25+0.75*Math.abs(Math.sin(t*6+i*1.3))*(0.4+0.6*bump)):0.08;el.style.height=(20+v*170)+'px'});
}
window.render=render;
</script>
