<script type="module">
// «Мысленный эксперимент» · «Отдалённые места» · two globe clips (?clip=nemo | ?clip=tristan). Clip t = film t − clip start.
// nemo    (film 134.25–150.96, 16.71 s): fall from the South Pacific globe onto Point Nemo, the 2 690 km circle, then the three
//         nearest lands at the words: Дюси (north), Моту-Нуи by Easter Island (north-east), Махер off Antarctica (south)
// tristan (film 347.36–362.56, 15.20 s): fall onto Tristan da Cunha (Sentinel-2 + terrain patch, true scale), close look,
//         pull back, line to Saint Helena, «≈ 2 400 км»
// Engine: the globe of cs_globe (Lemo-Opuscar 3D Map Explainer: Sentinel-2 cloudless texture, atmosphere, glowing ribbons, post).
// ?nosafe=1 shows the subtitle zone.
import * as THREE from 'three';
import { makePost } from './post.js';
import { clamp, lerp, seg, ss, eo, eio, track, mulberry } from '/core/lib.js';

const Wd = 1920, Ht = 1080, Q = new URLSearchParams(location.search);
const CLIP = Q.get('clip') || 'nemo';
const FULL = CLIP === 'nemo' ? 16.71 : 15.20;
const D2R = Math.PI / 180, RE = 6371;

// ---------- places ----------
const NEMO = [-48.8767, -123.3933], DUCIE = [-24.6833, -124.7867], MOTU = [-27.2033, -109.4533], MAHER = [-72.9667, -126.3667];
const TDC = [-37.1167, -12.2833], STH = [-15.95, -5.7167];

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
const SS = +(Q.get('ss') || 1);
renderer.setPixelRatio(SS); renderer.setSize(Wd, Ht);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);
const tl = new THREE.TextureLoader();
const loadTex = u => new Promise((r, e) => tl.load(u, r, undefined, e));
const worldTex = await loadTex('assets/world.jpg');
worldTex.colorSpace = THREE.SRGBColorSpace; worldTex.anisotropy = 16;

const gscene = new THREE.Scene(); gscene.background = new THREE.Color(0x04070b);
const gdir = (lat, lon) => new THREE.Vector3(Math.cos(lat * D2R) * Math.sin(lon * D2R), Math.sin(lat * D2R), Math.cos(lat * D2R) * Math.cos(lon * D2R));
const SUN = CLIP === 'nemo' ? gdir(-22, -150) : gdir(-18, -38);    // low from the north-west over each region
{
  const NU = 360, NV = 180, pos = [], uv = [], idx = [];
  for (let j = 0; j <= NV; j++) for (let i = 0; i <= NU; i++) {
    const lat = 90 - j * 180 / NV, lon = -180 + i * 360 / NU, p = gdir(lat, lon).multiplyScalar(RE);
    pos.push(p.x, p.y, p.z); uv.push(i / NU, 1 - j / NV);
  }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) { const a = j * (NU + 1) + i, b = a + NU + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  gscene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: worldTex, roughness: .85, metalness: 0 })));
  const am = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide, toneMapped: false,
    uniforms: { sunD: { value: SUN } },
    vertexShader: `varying vec3 vN, vP; void main(){ vN = normalize(normal); vec4 w = modelMatrix * vec4(position, 1.); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying vec3 vN, vP; uniform vec3 sunD; void main(){ vec3 v = normalize(cameraPosition - vP); float r = 1. - clamp(dot(vN, v), 0., 1.);
      float rim = pow(r, 3.2); float day = smoothstep(-.2, .45, dot(vN, sunD));
      vec3 c = mix(vec3(.20, .36, .60), vec3(.98, .80, .58), day * .5); gl_FragColor = vec4(c * rim * (.08 + .55 * day) * .6, 1.); }` });   // rp_maps: thinner veil (the sun sits near the view here)
  gscene.add(new THREE.Mesh(new THREE.SphereGeometry(RE * 1.012, 160, 80), am));
  const gs = new THREE.DirectionalLight(0xffe6c4, 2.0); gs.position.copy(SUN.clone().multiplyScalar(5e4)); gscene.add(gs, new THREE.HemisphereLight(0x3a5878, 0x0a0a10, .6));
  const R = mulberry(7), sp = [];
  for (let i = 0; i < 1600; i++) { const u = R() * 2 - 1, th = R() * Math.PI * 2, r = Math.sqrt(1 - u * u); sp.push(r * Math.cos(th) * 9e4, u * 9e4, r * Math.sin(th) * 9e4); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  gscene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x9aa6b4, size: 1.3, sizeAttenuation: false, transparent: true, opacity: .55 })));
}

// ---------- Tristan da Cunha: Sentinel-2 + terrain patch (true scale, no exaggeration) ----------
if (CLIP === 'tristan') {
  const M = await fetch('assets/tdc_meta.json').then(r => r.json());
  const H = new Float32Array(await fetch('assets/tdc_height.bin').then(r => r.arrayBuffer()));
  const tex = await loadTex('assets/tdc_albedo.jpg'); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
  const [W, S, E, N] = M.bbox, GW = M.GW, GH = M.GH, pos = new Float32Array(GW * GH * 3), uv = new Float32Array(GW * GH * 2), idx = [];
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const k = j * GW + i, lat = N - j / (GH - 1) * (N - S), lon = W + i / (GW - 1) * (E - W);
    const h = Math.max(0, H[k]) / 1000, p = gdir(lat, lon).multiplyScalar(RE + .05 + h);
    pos.set([p.x, p.y, p.z], k * 3); uv.set([i / (GW - 1), 1 - j / (GH - 1)], k * 2);
  }
  for (let j = 0; j < GH - 1; j++) for (let i = 0; i < GW - 1; i++) { const a = j * GW + i, b = a + GW; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  gscene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: .9, metalness: 0 })));
}
const gcam = new THREE.PerspectiveCamera(28, Wd / Ht, 1, 2e5);

// ---------- glowing ribbons on the sphere (cs_globe's ribbon; geometry can be rebuilt in place) ----------
const PIXK = 2 * Math.tan(THREE.MathUtils.degToRad(14)) / Ht;
const RIB_V = `attribute float aSide; attribute vec3 aNorm; attribute float aAlong;
  uniform float wW, pxW, pixK; varying float vSide, vAlong;
  void main(){ vec4 wp = modelMatrix * vec4(position, 1.); float pw = length(cameraPosition - wp.xyz) * pixK;
    float hw = max(wW * .5, pxW * .5 * pw); wp.xyz += normalize(mat3(modelMatrix) * aNorm) * aSide * hw; vSide = aSide; vAlong = aAlong;
    gl_Position = projectionMatrix * viewMatrix * wp; }`;

    float d = vSide; float g = exp(-d * d * k);
    float vis = smoothstep(revA - soft, revA, vAlong) * (1. - smoothstep(revB, revB + soft, vAlong));
    if (vis <= 0.) discard;
    float a = base;
    if (flowAmt > 0.) { float f = fract((vAlong - flowPh) / flowSp); a += flowAmt * smoothstep(1. - flowLen / flowSp, 1., f) * smoothstep(1., .985, f); }
    a += headAmt * exp(-pow((vAlong - head) / (2.5 * max(1., soft / 2.)), 2.));
    gl_FragColor = vec4(col * g * a * inten * vis, 1.); }`;

    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const t = new THREE.Vector3().subVectors(b, a), u = pts[i].clone().normalize();
    const n = new THREE.Vector3().crossVectors(t, u).normalize();
    if (i) L += pts[i].distanceTo(pts[i - 1]);
    for (const s of [1, -1]) { pos.push(pts[i].x, pts[i].y, pts[i].z); side.push(s); nrm.push(n.x, n.y, n.z); al.push(L); }
  }
  return { pos, side, nrm, al, L };
}
function ribbon(pts, o) {

  for (let i = 1; i < pts.length; i++) { const q = 2 * i; idx.push(q - 2, q - 1, q, q - 1, q + 1, q); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(A.pos, 3)); g.setAttribute('aSide', new THREE.Float32BufferAttribute(A.side, 1));
  g.setAttribute('aNorm', new THREE.Float32BufferAttribute(A.nrm, 3)); g.setAttribute('aAlong', new THREE.Float32BufferAttribute(A.al, 1)); g.setIndex(idx);
  const U = { col: new THREE.Color(o.col ?? 0xffa63d), k: o.k ?? 3, inten: 0, wW: 0, pxW: o.pxW ?? 2, pixK: PIXK, revA: -1e9, revB: 1e9, soft: o.soft ?? 40,
    head: -1e9, headAmt: 0, base: o.base ?? 1, L: A.L, flowSp: o.flowSp ?? 2000, flowLen: o.flowLen ?? 300, flowAmt: o.flowAmt ?? 0, flowPh: 0 };
  const uniforms = {}; for (const k in U) uniforms[k] = { value: U[k] };
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms, vertexShader: RIB_V, fragmentShader: RIB_F, side: THREE.DoubleSide, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, toneMapped: false }));
  m.renderOrder = o.order ?? 2; m.frustumCulled = false; gscene.add(m);
  m.L = A.L; m.u = uniforms; return m;
}
function reshape(m, pts) {
  const A = ribArrays(pts), g = m.geometry;
  g.attributes.position.array.set(A.pos); g.attributes.position.needsUpdate = true;
  g.attributes.aNorm.array.set(A.nrm); g.attributes.aNorm.needsUpdate = true;
  g.attributes.aAlong.array.set(A.al); g.attributes.aAlong.needsUpdate = true;
  m.L = A.L; m.u.L.value = A.L;
}
const rv = (r, a) => { for (const k in a) r.u[k].value = a[k]; };
const slerpV = (a, b, f) => { const ang = a.angleTo(b), s = Math.sin(ang) || 1; return ang < 1e-9 ? a.clone() : a.clone().multiplyScalar(Math.sin((1 - f) * ang) / s).add(b.clone().multiplyScalar(Math.sin(f * ang) / s)); };
// great-circle arc A → B, every ≤ 20 km, raised a little in the middle (peak km)
function gcArc(A, B, peak = 0) {
  const a = gdir(...A), b = gdir(...B), m = Math.max(2, Math.ceil(a.angleTo(b) * RE / 20)), P = [];
  for (let j = 0; j <= m; j++) { const f = j / m; P.push(slerpV(a, b, f).multiplyScalar(RE + 8 + peak * Math.sin(Math.PI * f))); }
  return P;
}
// a small circle of radius r km about C (N points, starting due north, clockwise)
function circlePts(C, r, Np = 540, lift = 8) {
  const [la, lo] = C.map(v => v * D2R), rho = Math.max(r, 1) / RE, P = [];
  for (let i = 0; i <= Np; i++) {
    const th = i / Np * 2 * Math.PI, la2 = Math.asin(Math.sin(la) * Math.cos(rho) + Math.cos(la) * Math.sin(rho) * Math.cos(th));
    const lo2 = lo + Math.atan2(Math.sin(th) * Math.sin(rho) * Math.cos(la), Math.cos(rho) - Math.sin(la) * Math.sin(la2));

const AMB = 0xffa63d, AMB2 = 0xffc36b, LIGHT = 0xf3e6cf;
function glowLine(pts, col, core, glowW = 12, coreW = 2.4, glowBase = .3) {
  return { pts, glow: ribbon(pts, { pxW: glowW, k: 3, base: glowBase, col }), core: ribbon(pts, { pxW: coreW, k: 1.2, base: 1, col: core }) };
}
// draw a line from its start: k 0→1; inten; flowing light along it
function drawLine(Lm, k, inten, t, flow = 0) {
  for (const r of [Lm.glow, Lm.core]) rv(r, { revB: k * r.L, inten: inten * (k > 0 ? 1 : 0), head: k * r.L, soft: 60,
    headAmt: r === Lm.core ? 1.8 * (1 - ss(seg(k, .85, 1))) : .6 * (1 - ss(seg(k, .85, 1))), flowAmt: flow, flowPh: t * 1800, flowSp: 2600, flowLen: 380 });
}

// ---------- camera: [log distance km, tilt°, heading°, target lat, lon, view offset y px] ----------
let CAM;
if (CLIP === 'nemo') CAM = track([
  [0.0, [Math.log(44000), 0, 180, -40.0, -117.0, 0]],
  [0.9, [Math.log(26000), 0, 180, -44.5, -120.5, 0]],
  [2.25, [Math.log(5600), 6, 180, NEMO[0], NEMO[1], 0]],
  [2.75, [Math.log(5450), 6, 180, NEMO[0], NEMO[1], 10]],
  [5.0, [Math.log(17000), 3, 180, NEMO[0] - .5, NEMO[1], 85]],
  [16.71, [Math.log(16300), 3, 180, NEMO[0] - .3, NEMO[1] + .6, 85]]]);
else CAM = track([       // the target and view offset of the pull-back are set in setCam (Tristan stays at y ≈ 720 while the view widens)
  [0.0, [Math.log(40000), 0, 180, -30.0, -18.0, 0]],
  [0.8, [Math.log(20000), 0, 180, -34.0, -14.5, 0]],
  [1.9, [Math.log(260), 22, 180, TDC[0] - .02, TDC[1], 0]],
  [2.6, [Math.log(44), 44, 180, TDC[0] - .015, TDC[1], 0]],
  [5.3, [Math.log(37), 47, 198, TDC[0] - .015, TDC[1] + .01, 0]],
  [6.2, [Math.log(1500), 22, 190, TDC[0], TDC[1], 0]],
  [7.4, [Math.log(9700), 0, 180, TDC[0] + .01, TDC[1] + .01, 0]],
  [8.6, [Math.log(10400), 0, 180, TDC[0] + .01, TDC[1] + .01, 0]],
  [15.2, [Math.log(10000), 0, 180, TDC[0] + .01, TDC[1] + .01, 0]]]);
const MID = [-26.6, -8.9];
function setCam(t) {
  let [ld, tilt, head, tla, tlo, oy] = CAM(clamp(t, 0, FULL)), dist = Math.exp(ld);
  let U = gdir(tla, tlo);
  if (CLIP === 'tristan') {   // pull-back: the target slides toward the line's middle in step with the distance, so Tristan holds its place on screen
    const w = ss(seg(t, 5.3, 6.6)); U = slerpV(gdir(tla, tlo), gdir(...MID), clamp(dist / 10400) * w); oy = 70 * w;
  }
  const T = U.clone().multiplyScalar(RE);
  const north = new THREE.Vector3(0, 1, 0).addScaledVector(U, -U.y).normalize(), east = new THREE.Vector3().crossVectors(north, U);
  const Hd = north.clone().multiplyScalar(Math.cos(head * D2R)).addScaledVector(east, Math.sin(head * D2R));
  const tr = tilt * D2R;
  gcam.position.copy(T).addScaledVector(U, dist * Math.cos(tr)).addScaledVector(Hd, dist * Math.sin(tr));
  gcam.up.copy(Hd.clone().negate().multiplyScalar(Math.cos(tr)).addScaledVector(U, Math.sin(tr)).normalize());

// ---------- post ----------
const gpost = makePost(renderer, gscene, gcam, Wd, Ht, { ssaa: SS, ao: false });
gpost.dof.maxCoc = 0; gpost.bloom.strength = .7; gpost.bloom.radius = .6; gpost.bloom.threshold = .9;
const GU = gpost.vig.uniforms; GU.amt.value = .5; GU.warm.value = .2; GU.sat.value = .95; GU.contrast.value = .1;

// ---------- overlay ----------
const ov = document.createElement('canvas'); ov.width = Wd * 2; ov.height = Ht * 2; ov.style.width = Wd + 'px'; ov.style.height = Ht + 'px'; document.body.appendChild(ov);
const g = ov.getContext('2d');
await Promise.all(['500 20px Fira', '600 20px Fira'].map(f => document.fonts.load(f, 'АБВ абв ≈ 2 690 км')));
const C = { light: '#f6eee0', amber: '#ffc36b', num: '#ffd08a', dim: 'rgba(240,232,216,.78)' };
const SAFE_Y = Ht - 250;                             // the bottom 250 px stay free of labels (Russian subtitles are burned in later)
let TX = [];
function txt(s, x, y, o) {

  g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; g.globalAlpha = clamp(o.a ?? 1); g.fillStyle = o.col || C.light;
  g.shadowColor = 'rgba(2,4,8,.85)'; g.shadowBlur = 14;
  g.fillText(s, x, y); g.shadowBlur = 0; g.fillText(s, x, y); const w = g.measureText(s).width;
  const x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
  if ((o.a ?? 1) > .5) TX.push({ text: s, x0, y0: y - o.size * .6, x1: x0 + w, y1: y + o.size * .6 });
  g.restore(); return w;
}
function dot(x, y, r, col, a = 1, blur = 0) { g.save(); g.globalAlpha = clamp(a); g.fillStyle = col; if (blur) { g.shadowColor = col; g.shadowBlur = blur; } g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore(); }

const scr = v => { const p = v.clone().project(gcam); return [(p.x + 1) / 2 * Wd, (1 - p.y) / 2 * Ht, p.z]; };
const facing = v => v.clone().normalize().dot(gcam.position.clone().sub(v).normalize()) > 0.02;
const at = (ll, lift = 8) => { const P = gdir(...ll).multiplyScalar(RE + lift); return facing(P) ? scr(P) : null; };
// pin: a bright dot with a ring that pops when it appears (t0)
function pin(ll, t, t0, a = 1, lift = 8) {

  const k = seg(t, t0, t0 + .7), pop = 1 + .6 * Math.exp(-Math.pow((t - t0 - .08) / .08, 2));

}
// a label next to a screen point
function labelAt(p, s, a, o = {}) {

// ================= NEMO =================
const EVN = [];
let frameNemo, frameTdc;
if (CLIP === 'nemo') {
  const T_PIN = 1.0, T_C0 = 2.7, T_C1 = 4.7, T_CL = 3.6;
  const LINES = [   // [place, line start, line end (pin), name, sub, sub time, name offset, dist-label side]
    { ll: DUCIE, a: 6.35, b: 7.05, name: 'Дюси', sub: null, nd: [0, -44, 'center'], side: -1 },
    { ll: MOTU, a: 7.9, b: 8.6, name: 'Моту-Нуи', sub: 'у острова Пасхи', st: 8.9, nd: [24, -4, 'left'], side: 1 },
    { ll: MAHER, a: 11.3, b: 12.0, name: 'Махер', sub: 'у берега Антарктиды', st: 13.3, nd: [24, -62, 'left'], side: -1 }];   // Махер's labels sit above the pin: the ice below is white
  for (const L of LINES) L.m = glowLine(gcArc(NEMO, L.ll, 40), AMB, AMB2, 12, 2.6);

  EVN.push({ t: 0, k: 'whoosh' }, { t: T_PIN, k: 'pin' }, { t: T_C0, k: 'rise' }, ...LINES.map(L => ({ t: L.b, k: 'pin' })));
  frameNemo = t => {

    // the circle grows from the point to 2 690 km (2.7 → 4.7), then stays as a faint ring
    const kc = eio(seg(t, T_C0, T_C1));
    if (t >= T_C0) reshape(CIRC.glow, circlePts(NEMO, 2690 * kc)), reshape(CIRC.core, circlePts(NEMO, 2690 * kc));
    const cI = t < T_C0 ? 0 : (1 - .45 * ss(seg(t, 5.6, 6.4))) * (1 + .35 * Math.exp(-Math.pow((t - 15.0) / .4, 2)));
    for (const r of [CIRC.glow, CIRC.core]) rv(r, { inten: cI, revB: 1e9 });
    LINES.forEach(L => { const k = eio(seg(t, L.a, L.b)); drawLine(L.m, k, 1.15, t, ss(seg(t, L.b, L.b + .6)) * (.6 + .5 * ss(seg(t, 14.7, 15.2)))); });
    gpost.composer.render();
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht); TX = [];
    // the circle's radius while it grows
    const aCL = ss(seg(t, T_CL, T_CL + .4)) * (1 - ss(seg(t, 5.7, 6.2)));
    if (aCL > 0) { const P = circlePts(NEMO, 2690 * kc, 8)[6], p = facing(P) ? scr(P) : null; if (p) labelAt(p, '≈ 2 690 км', aCL, { dx: -22, dy: 0, align: 'right', size: 40, col: C.num, w: 600, sp: 1 }); }
    LINES.forEach(L => {
      const p = pin(L.ll, t, L.b);
      if (p) {
        labelAt(p, L.name, ss(seg(t, L.b, L.b + .3)), { dx: L.nd[0], dy: L.nd[1], align: L.nd[2], size: 44 });
        if (L.sub) labelAt(p, L.sub, ss(seg(t, L.st, L.st + .35)), { dx: L.nd[0], dy: L.nd[1] + 38, align: L.nd[2], size: 30, w: 500, col: C.dim, sp: 1 });
      }
      distLabel(L.m, '≈ 2 690 км', ss(seg(t, L.b + .1, L.b + .5)), L.side, 26);
    });
    const p = pin(NEMO, t, T_PIN);
    labelAt(p, 'Точка Немо', ss(seg(t, T_PIN + .2, T_PIN + .55)), { dx: -26, dy: 0, align: 'right', size: 50 });
  };
}

// ================= TRISTAN =================
if (CLIP === 'tristan') {
  const T_LBL = .45, T_L0 = 6.15, T_L1 = 7.75, T_D = 9.3;
  const LN = glowLine(gcArc(TDC, STH, 60), AMB, AMB2, 12, 2.6);
  EVN.push({ t: 0, k: 'whoosh' }, { t: T_LBL, k: 'pin' }, { t: 5.3, k: 'whoosh' }, { t: T_L0, k: 'rise' }, { t: T_L1, k: 'pin' }, { t: T_D, k: 'pin' });
  frameTdc = t => {
    const dist = setCam(t);
    renderer.toneMappingExposure = 1.25 + .45 * (1 - ss(seg(Math.log(dist), Math.log(150), Math.log(1500))));
    const k = eio(seg(t, T_L0, T_L1));
    drawLine(LN, k, 1.15, t, ss(seg(t, T_L1, T_L1 + .6)) * .7);
    gpost.composer.render();
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht); TX = [];
    // the pin shows while the island is small; in the close look the island itself is the mark
    const far = ss(seg(Math.log(dist), Math.log(400), Math.log(1500)));
    pin(TDC, t, T_LBL, far);
    const aT = ss(seg(t, T_LBL, T_LBL + .35));
    // one label: above the island in the close look, right of the pin once it is small (the anchor slides between the two)
    const pC = at([TDC[0] + .05, TDC[1]], 2.2), pF = at(TDC);
    if (pF && aT > 0) {
      const a0 = pC ? [pC[0], pC[1] - 34] : [pF[0], pF[1] - 40], a1 = [pF[0] + 26, pF[1]], f = far;
      const tw = (g.font = '600 50px Fira', g.letterSpacing = '2px', g.measureText('Тристан-да-Кунья').width);
      labelAt([lerp(a0[0] - tw / 2, a1[0], f), lerp(a0[1], a1[1], f)], 'Тристан-да-Кунья', aT, { size: lerp(54, 48, f) });
    }
    const pS = pin(STH, t, T_L1);
    if (pS) labelAt(pS, 'Остров Святой Елены', ss(seg(t, T_L1, T_L1 + .35)), { dx: 26, dy: 0, size: 46 });
    distLabel(LN, '≈ 2 400 км', ss(seg(t, T_D, T_D + .4)), 1, 28, { size: 46 });
  };
}

const frame = t => { (CLIP === 'nemo' ? frameNemo : frameTdc)(t);
  if (Q.has('nosafe')) { g.save(); g.fillStyle = 'rgba(255,0,0,.18)'; g.fillRect(0, SAFE_Y, Wd, 250); g.restore(); } };
window.DUR = FULL;
window.render = t => frame(t);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
window.EV = EVN.map(e => ({ ...e, t: +e.t.toFixed(2) }));
window.render(0);
window.READY = true;
</script>
</body></html>
