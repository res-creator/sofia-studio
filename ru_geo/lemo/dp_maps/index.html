<script type="module">

// nyos    (film 123.65–141.11, 17.46 s): fall onto Lake Nyos (Cameroon), «озеро Ньос», «Камерун», «21 августа 1986»;

const Wd = 1920, Ht = 1080, Q = new URLSearchParams(location.search);

const EV = [27.9881, 86.9250], NY = [6.438, 10.298];
const EX = EVR ? 1 : 1.6;            // relief scale (Everest true scale; Nyos ×1.6 so the low valleys read — noted in CREDITS)

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });

const tl = new THREE.TextureLoader();

const worldTex = await loadTex('assets/world.jpg');

{
  const NU = 360, NV = 180, pos = [], uv = [], idx = [];

    const lat = 90 - j * 180 / NV, lon = -180 + i * 360 / NU, p = gdir(lat, lon).multiplyScalar(RE);

  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  gscene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: worldTex, roughness: .85, metalness: 0 })));
  const am = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide, toneMapped: false,
    uniforms: { sunD: { value: SUN } },
    vertexShader: `varying vec3 vN, vP; void main(){ vN = normalize(normal); vec4 w = modelMatrix * vec4(position, 1.); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying vec3 vN, vP; uniform vec3 sunD; void main(){ vec3 v = normalize(cameraPosition - vP); float r = 1. - clamp(dot(vN, v), 0., 1.);

  const atm = new THREE.Mesh(new THREE.SphereGeometry(RE * 1.012, 160, 80), am); atm.name = 'atm'; gscene.add(atm);
  const gs = new THREE.DirectionalLight(0xffe6c4, EVR ? 2.3 : 2.6); gs.position.copy(SUN.clone().multiplyScalar(5e4)); gscene.add(gs, new THREE.HemisphereLight(0x3a5878, 0x0a0a10, .6));
  const R = mulberry(7), sp = [];
  for (let i = 0; i < 1600; i++) { const u = R() * 2 - 1, th = R() * Math.PI * 2, r = Math.sqrt(1 - u * u); sp.push(r * Math.cos(th) * 9e4, u * 9e4, r * Math.sin(th) * 9e4); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  gscene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x9aa6b4, size: 1.3, sizeAttenuation: false, transparent: true, opacity: .55, fog: false })));
}

// ---------- terrain patches (Sentinel-2 + AWS terrain on the sphere) ----------
// wide: z9 box whose edge melts into the globe; detail: z13 box inside it (its edge band carries the wide heights), the wide mesh
// leaves out the triangles well inside the detail box
const PATCH = {};
async function patch(name, o = {}) {

  const H = new Float32Array(await fetch(`assets/${name}_height.bin`).then(r => r.arrayBuffer()));
  const tex = await loadTex(`assets/${name}_albedo.jpg`); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
  const [W, S, E, N] = M.bbox, GW = M.GW, GH = M.GH, pos = new Float32Array(GW * GH * 3), uv = new Float32Array(GW * GH * 2), idx = [];
  const lift = o.lift ?? .06;
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const k = j * GW + i, lat = N - j / (GH - 1) * (N - S), lon = W + i / (GW - 1) * (E - W);
    let h = Math.max(0, H[k]) / 1000 * EX;
    if (o.sink) {   // under the detailed patch the wide mesh sinks (0 at its edge → 150 m 1.5 km in), so it never pokes through it
      const b = o.sink, dIn = Math.min(lon - b[0], b[2] - lon, (lat - b[1]) * 1.0, b[3] - lat) * 111.2;
      if (dIn > 0) h -= .15 * Math.min(1, dIn / 1.5);

  }

  const inH = (j, i) => { if (!hole) return false; const lat = N - j / (GH - 1) * (N - S), lon = W + i / (GW - 1) * (E - W); return lon > hole[0] && lon < hole[2] && lat > hole[1] && lat < hole[3]; };
  for (let j = 0; j < GH - 1; j++) for (let i = 0; i < GW - 1; i++) {
    if (inH(j, i) && inH(j + 1, i + 1) && inH(j, i + 1) && inH(j + 1, i)) continue;
    const a = j * GW + i, b = a + GW; idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .92, metalness: 0 });
  if (o.front) Object.assign(mat, { polygonOffset: true, polygonOffsetFactor: -2 * o.front, polygonOffsetUnits: -4 * o.front });
  const mesh = new THREE.Mesh(g, mat); mesh.frustumCulled = false; gscene.add(mesh);
  // height in km (scaled) at lat/lon, bilinear on the grid
  const hAt = (lat, lon) => {
    const x = clamp((lon - W) / (E - W)) * (GW - 1), y = clamp((N - lat) / (N - S)) * (GH - 1), i = Math.min(GW - 2, Math.floor(x)), j = Math.min(GH - 2, Math.floor(y)), fx = x - i, fy = y - j;
    const v = (jj, ii) => Math.max(0, H[jj * GW + ii]);
    return lift + (v(j, i) * (1 - fx) * (1 - fy) + v(j, i + 1) * fx * (1 - fy) + v(j + 1, i) * (1 - fx) * fy + v(j + 1, i + 1) * fx * fy) / 1000 * EX;
  };

}
const inset = (b, d) => [b[0] + d, b[1] + d, b[2] - d, b[3] - d];
const bbox = n => fetch(`assets/${n}_meta.json`).then(r => r.json()).then(m => m.bbox);
// three nested patches: wide z9 → medium z11 → detailed z13; each outer one sinks under (and leaves a hole well inside) the next
const [PW, PM, PD] = EVR ? ['evw', 'evm', 'evd'] : ['nyw', 'nym', 'nyd'];
const bM = await bbox(PM), bD = await bbox(PD);
await patch(PW, { hole: inset(bM, .08), sink: bM, lift: .04 });
await patch(PM, { hole: inset(bD, .04), sink: bD, front: 1, lift: .05 });
const DET = await patch(PD, { front: 2 });
gscene.fog = new THREE.Fog(EVR ? 0x9db0c6 : 0x8fa4a8, 1e6, 2e6);
gscene.getObjectByName('atm').material.fog = false;

// summit of the mesh: the highest node within ~1 km of the coordinates
let TOP = null;
if (EVR) {
  const { H, W, S, E, N, GW, GH } = DET; let best = -1;
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const lat = N - j / (GH - 1) * (N - S), lon = W + i / (GW - 1) * (E - W);
    if (Math.abs(lat - EV[0]) < .01 && Math.abs(lon - EV[1]) < .011 && H[j * GW + i] > best) { best = H[j * GW + i]; TOP = [lat, lon, best]; }
  }
}
const gcam = new THREE.PerspectiveCamera(28, Wd / Ht, 1, 2e5);

// ---------- Nyos: the gas (a rising cloud of soft puffs, then a low layer down the valleys) ----------
let GAS = null;
if (!EVR) {
  const GM = await fetch('assets/nyd_gas.json').then(r => r.json());
  const img = await new Promise((r, e) => { const im = new Image(); im.onload = () => r(im); im.onerror = e; im.src = 'assets/nyd_gas.png'; });
  const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
  const px = cx.getImageData(0, 0, img.width, img.height).data;
  const gtex = new THREE.Texture(img); gtex.needsUpdate = true; gtex.colorSpace = THREE.NoColorSpace; gtex.minFilter = THREE.LinearFilter; gtex.generateMipmaps = false;
  const { H, W, S, E, N, GW, GH, lift } = DET;
  const LL = (j, i) => [N - j / (GH - 1) * (N - S), W + i / (GW - 1) * (E - W)];
  // layer mesh over the reached box, 30 m (scaled) above the ground
  const i0 = Math.max(0, GM.j0 - 3), i1 = Math.min(GW - 1, GM.j1 + 3), j0 = Math.max(0, GM.i0 - 3), j1 = Math.min(GH - 1, GM.i1 + 3);
  const nw = i1 - i0 + 1, nh = j1 - j0 + 1, pos = new Float32Array(nw * nh * 3), uv = new Float32Array(nw * nh * 2), idx = [];
  for (let j = 0; j < nh; j++) for (let i = 0; i < nw; i++) {

    const p = gdir(la, lo).multiplyScalar(RE + lift + Math.max(0, H[J * GW + I]) / 1000 * EX + .03);
    pos.set([p.x, p.y, p.z], k * 3); uv.set([(I + .5) / GW, 1 - (J + .5) / GH], k * 2);
  }

  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx);
  const U = { tG: { value: gtex }, front: { value: -1 }, op: { value: 0 }, lakeOp: { value: 0 }, time: { value: 0 }, col: { value: new THREE.Color(0xcfdade) } };
  const lmat = new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthWrite: false, toneMapped: true,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -8,
    vertexShader: `varying vec2 vUv; varying vec3 vW; void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform sampler2D tG; uniform float front, op, lakeOp, time; uniform vec3 col; varying vec2 vUv; varying vec3 vW;
      float hs(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
        return mix(mix(hs(i), hs(i + vec2(1, 0)), f.x), mix(hs(i + vec2(0, 1)), hs(i + vec2(1, 1)), f.x), f.y); }
      void main(){ vec4 s = texture2D(tG, vUv); float st = s.g; if (st < .01) discard;
        float r = s.r, lake = s.b;
        float a = st * smoothstep(front, front - .07, r);
        a = max(a * op, lake * lakeOp);
        vec2 q = vUv * vec2(260., 260.);
        float n = .55 * vn(q + vec2(time * .9, -time * .6)) + .3 * vn(q * 2.3 - vec2(time * 1.4, time * .3)) + .15 * vn(q * 5.1);
        a *= .3 + 1.0 * n;
        if (a < .004) discard;
        gl_FragColor = vec4(col, clamp(a, 0., 1.) * .3); }` });
  const layer = new THREE.Mesh(g, lmat); layer.renderOrder = 5; layer.frustumCulled = false; gscene.add(layer);
  // lake cells and flow paths (arrival descent: from a reached cell step to the neighbour that the gas reached earliest, back to the lake)
  const R = (J, I) => px[(J * GW + I) * 4], G = (J, I) => px[(J * GW + I) * 4 + 1], B = (J, I) => px[(J * GW + I) * 4 + 2];
  const lakeC = [];

  const rnd = mulberry(11);
  const paths = GM.paths;      // tools/gas.py: from the lake outward, [row, col, arrival 0..1]
  // puffs: a soft blob texture drawn in code
  const pc = document.createElement('canvas'); pc.width = pc.height = 128; const pg = pc.getContext('2d');
  const pr = mulberry(5);
  for (let k = 0; k < 9; k++) { const x = 64 + (pr() - .5) * 46, y = 64 + (pr() - .5) * 46, r = 24 + pr() * 26, gr = pg.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); pg.fillStyle = gr; pg.fillRect(0, 0, 128, 128); }
  const ptex = new THREE.CanvasTexture(pc); ptex.colorSpace = THREE.SRGBColorSpace;
  const NP = 70, ppos = new Float32Array(NP * 3), pa = new Float32Array(NP), psz = new Float32Array(NP);
  const pg2 = new THREE.BufferGeometry(); pg2.setAttribute('position', new THREE.BufferAttribute(ppos, 3)); pg2.setAttribute('aA', new THREE.BufferAttribute(pa, 1)); pg2.setAttribute('aS', new THREE.BufferAttribute(psz, 1));
  const pmat = new THREE.ShaderMaterial({ uniforms: { tP: { value: ptex }, scale: { value: Ht / 2 }, col: { value: new THREE.Color(0xb9c6ca) } }, transparent: true, depthWrite: false,
    vertexShader: `attribute float aA, aS; uniform float scale; varying float vA; void main(){ vA = aA; vec4 mv = modelViewMatrix * vec4(position, 1.);
      gl_PointSize = aS * projectionMatrix[1][1] * scale / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D tP; uniform vec3 col; varying float vA; void main(){ float a = texture2D(tP, gl_PointCoord).a * vA; if (a < .003) discard; gl_FragColor = vec4(col, a); }` });
  const puffs = new THREE.Points(pg2, pmat); puffs.renderOrder = 6; puffs.frustumCulled = false; gscene.add(puffs);
  const PF = [];
  for (let n = 0; n < NP; n++) {
    const c = lakeC[Math.floor(rnd() * lakeC.length)];
    PF.push({ c, top: .04 + rnd() * .42, s: .45 + rnd() * .5, ph: rnd() * 6.28, dl: rnd() * .7, path: paths[n % paths.length], pf: .15 + rnd() * .85, dx: (rnd() - .5) * .7, dy: (rnd() - .5) * .7 });

  const LAKE_Z = lift + GM.lake_level / 1000 * EX;
  GAS = { U, lakeLL: NY, update(t, T_UP, T_FLOW, front) {
    U.time.value = t;
    for (let n = 0; n < NP; n++) {
      const f = PF[n], rise = eo(seg(t, T_UP + f.dl, T_UP + f.dl + 2.4)), sink = ss(seg(t, T_FLOW - .6, T_FLOW + .9));
      const [J, I] = f.c; let p;

        p = a.lerp(q, sink);

      const sp = rise * (1 - sink) * (.4 + .6 * f.top / .46); ppos.set([p.x + f.dx * sp, p.y + f.dy * sp * .5, p.z + f.dy * sp], n * 3);

}

// ---------- camera: [log distance km, tilt°, heading°, target lat, lon, target altitude km, view offset y px] ----------
let CAM;
if (EVR) CAM = track([
  [0.0, [Math.log(30000), 0, 180, 22.0, 84.0, 0, 0]],
  [0.75, [Math.log(9000), 0, 180, 26.5, 86.0, 0, 0]],
  [1.55, [Math.log(420), 28, 185, EV[0] - .05, EV[1], 3, 0]],
  [2.3, [Math.log(33), 63, 205, EV[0], EV[1], 4.6, 60]],
  [8.35, [Math.log(28.5), 67, 258, EV[0], EV[1], 4.6, 60]]]);
else CAM = track([
  [0.0, [Math.log(30000), 0, 180, 2.0, 16.0, 0, 0]],
  [0.8, [Math.log(9000), 0, 180, 5.0, 12.0, 0, 0]],
  [1.8, [Math.log(260), 22, 182, NY[0] - .02, NY[1], .5, 0]],
  [2.7, [Math.log(30), 46, 190, NY[0], NY[1], 1.6, 0]],
  [6.6, [Math.log(15.5), 50, 198, NY[0] + .005, NY[1], 1.7, 0]],
  [12.6, [Math.log(13.0), 54, 214, NY[0] + .005, NY[1], 1.7, 0]],
  [14.6, [Math.log(34), 47, 200, NY[0] + .035, NY[1] - .005, 1.6, 0]],
  [17.46, [Math.log(33), 48, 194, NY[0] + .04, NY[1] - .005, 1.6, 0]]]);
function setCam(t) {
  let [ld, tilt, head, tla, tlo, alt, oy] = CAM(clamp(t, 0, FULL)), dist = Math.exp(ld);
  const U = gdir(tla, tlo), T = U.clone().multiplyScalar(RE + alt);

  gcam.position.copy(T).addScaledVector(U, dist * Math.cos(tr)).addScaledVector(Hd, dist * Math.sin(tr));
  gcam.up.copy(Hd.clone().negate().multiplyScalar(Math.cos(tr)).addScaledVector(U, Math.sin(tr)).normalize());

  gscene.fog.near = lerp(1e6, dist * 1.4, fz); gscene.fog.far = lerp(2e6, dist * (EVR ? 6 : 5), fz);
  return dist;
}

// ---------- post ----------
const gpost = makePost(renderer, gscene, gcam, Wd, Ht, { ssaa: SS, ao: false });
gpost.dof.maxCoc = 0; gpost.bloom.strength = .55; gpost.bloom.radius = .6; gpost.bloom.threshold = .95;
const GU = gpost.vig.uniforms; GU.amt.value = .5; GU.warm.value = .15; GU.sat.value = .95; GU.contrast.value = .12;

// ---------- overlay ----------
const ov = document.createElement('canvas'); ov.width = Wd * 2; ov.height = Ht * 2; ov.style.width = Wd + 'px'; ov.style.height = Ht + 'px'; document.body.appendChild(ov);
const g = ov.getContext('2d');
await Promise.all(['500 20px Fira', '600 20px Fira'].map(f => document.fonts.load(f, 'АБВ абв ≈ 1/3 9 км')));
const C = { light: '#f6eee0', amber: '#ffc36b', num: '#ffd08a', dim: 'rgba(240,232,216,.82)' };
const SAFE_Y = Ht - 250;                             // the bottom 250 px stay free of labels (Russian subtitles are burned in later)
let TX = [];
function txt(s, x, y, o) {
  g.save(); g.font = `${o.w || 500} ${o.size}px Fira`; g.letterSpacing = (o.sp || 0) + 'px';
  g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; g.globalAlpha = clamp(o.a ?? 1); g.fillStyle = o.col || C.light;
  g.shadowColor = 'rgba(2,4,8,.9)'; g.shadowBlur = 16;
  g.fillText(s, x, y); g.shadowBlur = 0; g.fillText(s, x, y); const w = g.measureText(s).width;
  const x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
  if ((o.a ?? 1) > .5) TX.push({ text: s, x0, y0: y - o.size * .6, x1: x0 + w, y1: y + o.size * .6 });
  g.restore(); return w;
}
function dot(x, y, r, col, a = 1, blur = 0) { g.save(); g.globalAlpha = clamp(a); g.fillStyle = col; if (blur) { g.shadowColor = col; g.shadowBlur = blur; } g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore(); }
function ring(x, y, r, col, a, w = 2) { if (a <= 0) return; g.save(); g.globalAlpha = clamp(a); g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.restore(); }
function line(x0, y0, x1, y1, col, a, w = 2, dash = null, glow = 0) { if (a <= 0) return; g.save(); g.globalAlpha = clamp(a); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  if (dash) g.setLineDash(dash); if (glow) { g.shadowColor = col; g.shadowBlur = glow; } g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.restore(); }
const scr = v => { const p = v.clone().project(gcam); return [(p.x + 1) / 2 * Wd, (1 - p.y) / 2 * Ht, p.z]; };
const facing = v => v.clone().normalize().dot(gcam.position.clone().sub(v).normalize()) > -0.2;
const at = (ll, lift = 0) => { const P = gdir(...ll).multiplyScalar(RE + lift); return facing(P) ? scr(P) : null; };
function pin(p, t, t0, a = 1) {
  if (!p || t < t0 || a <= 0) return;
  const k = seg(t, t0, t0 + .7), pop = 1 + .6 * Math.exp(-Math.pow((t - t0 - .08) / .08, 2));
  ring(p[0], p[1], 8 + 46 * eo(k), C.amber, a * (1 - k) * .9, 2.5);
  dot(p[0], p[1], 11 * pop, 'rgba(255,170,80,.35)', a, 20);
  dot(p[0], p[1], 6.5 * pop, '#ffd9a0', a, 10);
  return p;
}
function labelAt(p, s, a, o = {}) {
  if (!p || a <= 0) return;
  return txt(s, p[0] + (o.dx || 0), p[1] + (o.dy || 0), { size: o.size || 44, w: o.w || 600, sp: o.sp ?? 2, align: o.align || 'left', col: o.col || C.light, a });
}
const EVN = [];
let frameFn;

// ================= EVEREST =================
if (EVR) {
  const T_PIN = 1.25, T_P0 = 2.35, T_P1 = 3.55, T_PL = 3.2, T_BAR = 5.45;
  EVN.push({ t: 0, k: 'whoosh' }, { t: T_PIN, k: 'pin' }, { t: T_P0, k: 'rise' }, { t: T_PL, k: 'pin' }, { t: T_BAR, k: 'pin' });
  const topH = TOP[2] / 1000 * EX + DET.lift;
  frameFn = t => {
    const dist = setCam(t);
    renderer.toneMappingExposure = lerp(1.25, .9, 1 - ss(seg(Math.log(dist), Math.log(80), Math.log(800))));
    gpost.composer.render();
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht); TX = [];
    const pT = at(TOP, topH), pB = at(TOP, 0);
    // the height pillar: sea level (inside the mountain: dashed) → the summit, 1 km ticks
    const kp = eio(seg(t, T_P0, T_P1)), aP = ss(seg(t, T_P0 - .1, T_P0 + .2));
    if (pT && pB && aP > 0) {
      const hk = topH * kp, X = (hkm) => scr(gdir(TOP[0], TOP[1]).multiplyScalar(RE + hkm));
      const pTop = X(hk);
      // outside the dashed core: a soft glow so the pillar reads over the snow
      line(pB[0], pB[1], pTop[0], pTop[1], 'rgba(10,14,20,.55)', aP, 7);
      line(pB[0], pB[1], pTop[0], pTop[1], C.amber, aP, 3, [10, 7], 8);
      for (let k = 1; k <= 8; k++) if (k <= hk) { const q = X(k), w = k % 2 ? 8 : 13; line(q[0] - w, q[1], q[0] + w, q[1], C.amber, aP * .95, 2.2); }
      line(pB[0] - 22, pB[1], pB[0] + 22, pB[1], C.amber, aP, 3);
      labelAt(pB, 'уровень моря', aP * ss(seg(t, T_P0, T_P0 + .4)), { dx: 32, dy: 0, size: 28, w: 500, col: C.dim, sp: 1 });
      if (kp > 0) dot(pTop[0], pTop[1], 5, '#ffe2b0', aP, 12);
    }
    const pk = pin(pT, t, T_PIN);
    labelAt(pk, 'Эверест', ss(seg(t, T_PIN + .1, T_PIN + .45)), { dx: -30, dy: -6, align: 'right', size: 58 });
    if (pT) labelAt(pT, 'почти 9 км', ss(seg(t, T_PL, T_PL + .4)), { dx: 30, dy: -6, size: 52, col: C.num, sp: 1 });
    // давление ≈ 1/3: a card at the upper right with a three-part bar, one part lit
    const aB = ss(seg(t, T_BAR, T_BAR + .45));
    if (aB > 0) {
      const x = 1290, y = 150, bw = 420, bh = 20, kf = eio(seg(t, T_BAR + .15, T_BAR + .9));
      txt('давление ≈ 1/3', x, y, { size: 60, w: 600, sp: 1, align: 'left', col: C.num, a: aB });
      txt('от привычного', x, y + 52, { size: 32, w: 500, sp: 1, align: 'left', col: C.dim, a: aB });
      g.save(); g.globalAlpha = aB;
      g.fillStyle = 'rgba(8,12,18,.45)'; g.fillRect(x, y + 92, bw, bh);
      g.fillStyle = C.amber; g.shadowColor = C.amber; g.shadowBlur = 12; g.fillRect(x, y + 92, bw / 3 * kf, bh); g.shadowBlur = 0;
      g.strokeStyle = 'rgba(246,238,224,.8)'; g.lineWidth = 2; g.strokeRect(x, y + 92, bw, bh);
      for (const f of [1, 2]) { g.beginPath(); g.moveTo(x + bw * f / 3, y + 92); g.lineTo(x + bw * f / 3, y + 92 + bh); g.stroke(); }
      g.restore();
    }
  };
}

// ================= NYOS =================
if (!EVR) {
  const T_PIN = .95, T_CM = 1.75, T_DATE = 2.55, T_UP = 6.85, T_HEAVY = 13.4, T_FLOW = 14.0, T_F1 = 17.3;
  EVN.push({ t: 0, k: 'whoosh' }, { t: T_PIN, k: 'pin' }, { t: T_DATE, k: 'pin' }, { t: T_UP, k: 'rise' }, { t: T_HEAVY, k: 'pin' }, { t: T_FLOW, k: 'whoosh' });
  const lakeZ = DET.hAt(...NY);
  frameFn = t => {
    const dist = setCam(t);
    renderer.toneMappingExposure = 1.55 + .15 * (1 - ss(seg(Math.log(dist), Math.log(60), Math.log(600))));
    const front = lerp(-.05, 1.08, ss(seg(t, T_FLOW, T_F1)) * .15 + eio(seg(t, T_FLOW, T_F1)) * .85);
    GAS.U.front.value = front; GAS.U.op.value = ss(seg(t, T_FLOW - .3, T_FLOW + .5));
    GAS.U.lakeOp.value = ss(seg(t, T_UP + .3, T_UP + 1.8)) * .4;
    GAS.update(t, T_UP, T_FLOW, front);
    gpost.composer.render();
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht); TX = [];
    // pin while the place is small; the lake itself is the mark up close
    const far = ss(seg(Math.log(dist), Math.log(25), Math.log(120)));
    const pL = at(NY, lakeZ);
    pin(pL, t, T_PIN, Math.max(far, .0) * (1 - ss(seg(t, T_UP - .4, T_UP))));
    // name above the lake (fades while the cloud rises, comes back small during the flow)
    const aN = ss(seg(t, T_PIN + .1, T_PIN + .45)) * (1 - ss(seg(t, T_UP + .2, T_UP + .8)));
    if (pL) {
      const y0 = pL[1] - lerp(86, 40, far);
      labelAt([pL[0], y0], 'озеро Ньос', aN, { align: 'center', size: 58 });
      labelAt([pL[0], y0 + 50], 'Камерун', aN * ss(seg(t, T_CM, T_CM + .4)), { align: 'center', size: 36, w: 500, col: C.dim, sp: 3 });
      const aN2 = ss(seg(t, T_FLOW + .6, T_FLOW + 1.1));
      labelAt([pL[0], pL[1] + 6], 'озеро Ньос', aN2, { align: 'center', size: 34, w: 600, sp: 1 });
    }
    // date (upper left)
    const aD = ss(seg(t, T_DATE, T_DATE + .45));
    if (aD > 0) {
      txt('21 августа 1986', 110, 130, { size: 64, w: 600, sp: 1, align: 'left', col: C.num, a: aD });
      line(112, 176, 112 + 340 * eo(seg(t, T_DATE + .1, T_DATE + .8)), 176, C.amber, aD * .9, 2.5);
    }
    // «углекислый газ тяжелее воздуха»: under the date, with a small arrow pointing down
    const aH = ss(seg(t, T_HEAVY, T_HEAVY + .45));
    if (aH > 0) {
      txt('углекислый газ', 110, 246, { size: 46, w: 600, sp: 1, align: 'left', col: C.light, a: aH });
      txt('тяжелее воздуха', 110, 296, { size: 46, w: 600, sp: 1, align: 'left', col: C.light, a: aH });
      const ax = 500, ay = 240, k = eo(seg(t, T_HEAVY + .1, T_HEAVY + .7));
      line(ax, ay, ax, ay + 62 * k, C.amber, aH, 3.5, null, 8);
      line(ax - 13, ay + 62 * k - 14, ax, ay + 62 * k, C.amber, aH * k, 3.5); line(ax + 13, ay + 62 * k - 14, ax, ay + 62 * k, C.amber, aH * k, 3.5);
    }
  };
}

const frame = t => { frameFn(t);
  if (Q.has('nosafe')) { g.save(); g.fillStyle = 'rgba(255,0,0,.18)'; g.fillRect(0, SAFE_Y, Wd, 250); g.restore(); } };
window.DUR = FULL;
window.render = t => frame(t);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
window.EV = EVN.map(e => ({ ...e, t: +e.t.toFixed(2) }));
window.render(0);
window.READY = true;
</script>
</body></html>
