const PIXK = 2 * Math.tan(THREE.MathUtils.degToRad(14)) / Ht;

const GV = OL.greenland.map(([la, lo]) => gdir(la, lo)), C1 = COP[0];
const gC = gdir(...OL.greenland_center), cC = gdir(...OL.copies[0].center);

  for (let a = 0; a < 360; a += .5) {

  [1.25, [Math.log(9000), 49.0, -36.0, 70.0, -40.0]],
  [2.2, [Math.log(19000), 26.0, -9.0, 30.0, -5.0]],
  [3.05, [Math.log(21500), -1.0, 22.0, -1.5, 23.0]],
