    // the line from the coast to the fort, «≈ 13 км» beside its middle
    const kL = eio(seg(t, T_L0, T_L1)), aL = ss(seg(t, T_L0 - .1, T_L0 + .2));
    const r = pathDraw(LINE, kL, aL, { w: 3, dash: [12, 9], glow: 8 });
    if (r && kL > 0) { dot(r.P[0][0], r.P[0][1], 5, '#ffe2b0', aL, 10); }
    if (r) { const m = r.P[20], d0 = r.P[0], d1 = r.P[40]; let nx = d1[1] - d0[1], ny = -(d1[0] - d0[0]); const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      if (ny > 0) { nx = -nx; ny = -ny; }        // the label above the line
      labelAt([m[0] + nx * 40, m[1] + ny * 40], '≈ 13 км', ss(seg(t, T_D, T_D + .4)), { align: 'center', size: 50, col: C.num, sp: 1 }); }
    // «Северное море» on the open sea
    labelAt(atG([51.935, 1.66]), 'Северное море', ss(seg(t, T_SEA, T_SEA + .5)), { align: 'center', size: 48, w: 600, sp: 3, col: C.dim });
    // the fort: pin, «Рафс-Тауэр» / «морской форт», then «княжество Силенд» takes the top line
    const pS = pin(atG(SL), t, T_PIN);
    if (pS) {
      const kS = ss(seg(t, T_SL, T_SL + .45));
      labelAt(pS, 'Рафс-Тауэр', ss(seg(t, T_RT, T_RT + .4)) * (1 - kS), { dx: 30, dy: -8, size: 52 });
      labelAt(pS, 'морской форт', ss(seg(t, T_RT + .2, T_RT + .6)) * (1 - kS), { dx: 31, dy: 40, size: 32, w: 500, col: C.dim, sp: 1 });
      labelAt(pS, 'княжество', kS, { dx: 31, dy: -52, size: 34, w: 500, col: C.dim, sp: 2 });
      labelAt(pS, 'Силенд', kS, { dx: 30, dy: -4, size: 66 });
      labelAt(pS, 'Рафс-Тауэр', kS * .9, { dx: 31, dy: 46, size: 32, w: 500, col: C.dim, sp: 1 });
    }
  };
}

// ================= LIBERLAND =================
if (CLIP === 'liberland') {
  const SIGA = await fetch('assets/siga_osm.json').then(r => r.json());   // [lat, lon] ring, OSM relation 19735507
  const T_DATE = .5, T_PIN = 4.3, T_DN = 6.2, T_HR = 7.5, T_SR = 8.3, T_O0 = 8.8, T_O1 = 10.0, T_KM = 9.7, T_PULSE = 16.0;
  EVN.push({ t: 0, k: 'whoosh' }, { t: T_DATE, k: 'pin' }, { t: T_PIN, k: 'pin' }, { t: T_HR, k: 'pin' }, { t: T_SR, k: 'pin' }, { t: T_O0, k: 'rise' }, { t: T_KM, k: 'pin' });
  frameFn = t => {
    const dist = setCam(t);
    renderer.toneMappingExposure = 1.65 + .15 * (1 - ss(seg(Math.log(dist), Math.log(60), Math.log(800))));
    gpost.composer.render();
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht); TX = [];
    dateCard('2015', t, T_DATE, 150);
    // the plot: outline drawn round, then a faint fill; a soft pulse when the narration calls it «ничей»
    const kO = eio(seg(t, T_O0, T_O1)), aO = ss(seg(t, T_O0 - .1, T_O0 + .2));
    const pul = Math.exp(-Math.pow((t - T_PULSE) / .35, 2));
    pathDraw(SIGA, kO, aO, { w: 3 + 1.5 * pul, glow: 10 + 14 * pul, fill: (.16 + .14 * pul) * ss(seg(t, T_O1 - .1, T_O1 + .5)) });
    // pin while the place is small; the outline is the mark up close
    const far = ss(seg(Math.log(dist), Math.log(30), Math.log(90)));
    const pL = atG(LB);
    pin(pL, t, T_PIN, Math.max(far, 1 - ss(seg(t, T_O0, T_O1))));
    if (pL) {
      const y0 = pL[1] - lerp(lerp(150, 115, ss(seg(t, 8, 11))), 44, far);
      labelAt([pL[0], y0], 'Либерленд', ss(seg(t, T_PIN + .1, T_PIN + .45)), { align: 'center', size: 58 });
      labelAt([pL[0] - 8, pL[1] + 4], '≈ 7 км²', ss(seg(t, T_KM, T_KM + .4)), { align: 'center', size: 44, col: C.num, sp: 1 });   // inside the plot
    }
    labelAt(atG([45.818, 18.857]), 'Дунай', ss(seg(t, T_DN, T_DN + .45)), { align: 'center', size: 44, w: 600, sp: 4, col: '#cfe3ee' });
    labelAt(atG([45.800, 18.818]), 'Хорватия', ss(seg(t, T_HR, T_HR + .45)), { align: 'center', size: 50, w: 600, sp: 4, col: C.dim });
    labelAt(atG([45.778, 18.958]), 'Сербия', ss(seg(t, T_SR, T_SR + .45)), { align: 'center', size: 50, w: 600, sp: 4, col: C.dim });
  };
}

// ================= HUTT RIVER =================
if (CLIP === 'hutt') {
  const T_AU = 3.0, T_DATE = 5.9, T_PIN = 11.2, T_HR = 13.9, T_KM = 15.7, T_WA = 17.6;
  EVN.push({ t: 0, k: 'whoosh' }, { t: T_AU, k: 'pin' }, { t: T_DATE, k: 'pin' }, { t: T_PIN, k: 'pin' }, { t: T_HR, k: 'pin' }, { t: T_KM, k: 'pin' }, { t: T_WA, k: 'pin' });
  frameFn = t => {
    const dist = setCam(t);
    renderer.toneMappingExposure = 1.05 + .2 * (1 - ss(seg(Math.log(dist), Math.log(60), Math.log(800))));
    gpost.composer.render();
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht); TX = [];
    labelAt(at([-24.5, 134.0], 50), 'Австралия', ss(seg(t, T_AU, T_AU + .5)) * (1 - ss(seg(t, 6.0, 6.7))), { align: 'center', size: 56, w: 600, sp: 4 });
    dateCard('1970', t, T_DATE, 150);
    const pH = pin(atG(HT), t, T_PIN);
    if (pH) {
      labelAt(pH, 'Хатт-Ривер', ss(seg(t, T_HR, T_HR + .4)), { dx: 30, dy: -8, size: 58 });
      labelAt(pH, '≈ 75 км²', ss(seg(t, T_KM, T_KM + .4)), { dx: 31, dy: 44, size: 42, col: C.num, sp: 1 });
    }
    txt('Западная Австралия', 110, 236, { size: 46, w: 600, sp: 1, align: 'left', col: C.light, a: ss(seg(t, T_WA, T_WA + .5)) });   // under the date, as in the Nyos clip
  };
}

const frame = t => { frameFn(t);
  if (Q.has('nosafe')) { g.save(); g.fillStyle = 'rgba(255,0,0,.18)'; g.fillRect(0, SAFE_Y, Wd, 250); g.restore(); } };
window.DUR = FULL;
window.render = t => frame(t);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
window.EV = EVN.map(e => ({ ...e, t: +e.t.toFixed(2) }));
window.render(0);
window.READY = true;
</script>
</body></html>
