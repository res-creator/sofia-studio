<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Создать страну · Briefing Board</title>
<style>
  @font-face { font-family: 'Pangolin'; src: url('kit/fonts/Pangolin-sub.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Fira Sans Condensed'; src: url('kit/fonts/FiraSansCondensed-500-sub.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Fira Sans Condensed'; src: url('kit/fonts/FiraSansCondensed-700-sub.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Fira Sans Condensed'; src: url('kit/fonts/FiraSansCondensed-900-sub.woff2') format('woff2'); font-weight: 900; }
  @font-face { font-family: 'Plex Mono'; src: url('kit/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400 500; unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
  @font-face { font-family: 'Plex Mono'; src: url('kit/fonts/ibm-plex-mono-cyrillic-400-normal.woff2') format('woff2'); font-weight: 400 500; unicode-range: U+0400-045F, U+2116; }
  html, body { margin: 0; background: #8F8B83; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { setScene, renderScene, loadFonts, sceneTexts, sceneEvents, subCheck, camAt, toWorld, screenSpeed, resCheck } from './kit/board.js';
  const cv = document.getElementById('c');
  const q = new URLSearchParams(location.search);
  function size() { cv.width = innerWidth; cv.height = innerHeight; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; }
  size();
  let cur = null;
  window.loadScene = async (url) => {
    const s = await (await fetch(url)).json();
    cur = await setScene(s); window.DUR = cur.dur || 1; window.EV = sceneEvents(); size();
    return { t: s.t ?? cur.t ?? 1000, size: s.size || [1920, 1080] };
  };
  window.render = (t) => renderScene(cv, t);
  window.TEXTS = (t) => sceneTexts(t);
  window.CAM = (t) => camAt(t);
  window.TOWORLD = (p, t) => toWorld(p, t);
  window.SPEED = (t) => screenSpeed(t);
  window.RESCHECK = (t) => resCheck(t);
  await loadFonts();
  await window.loadScene(q.get('scene') || 'scenes/film.json');
  window.render(cur.t ?? 0);
  window.READY = true;
</script>
</body>
</html>
