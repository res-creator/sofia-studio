{

  wm.position.set((WX0 + WX1) / 2, -.03, (WZ0 + WZ1) / 2); scene.add(wm);
  PM.forEach((p, i) => {
    const pm = terrainMesh(p.X1 - p.X0, p.Z1 - p.Z0, p.m.GW, p.m.GH, p.buf, terrainMat(TEX[3 + 3 * i], TEX[4 + 3 * i], TEX[5 + 3 * i], null, null, new THREE.Vector4(p.X0 + 2, p.Z0 + 2, p.X1 - 2, p.Z1 - 2)));
    pm.position.set((p.X0 + p.X1) / 2, 0, (p.Z0 + p.Z1) / 2); scene.add(pm);

const JT = { ll: [39.0858, 21.7347], m: 1000 };      // Jeddah Tower, under construction (≈1 000 m planned)

  [1.55, [Math.log(330), 52, 9, 55.05, 25.15, 14]],

    }
  }
}
function note(t) {
  const a = ss(seg(t, 2.0, 2.6)) * .9;
  txt('рельеф ×3,2 · одно деление столбца = 100 м', Wd - 48, 52, { size: 21, w: 500, sp: 1.5, align: 'right', col: 'rgba(240,232,216,.8)', a, id: 'note', shadow: 1 });
}

// ---------- the frame at clip time ----------
function frame(tt) {
  t = tt; TX = [];
  const dist = setCamera(t);
  PBK.grp.visible = t >= 1.8; growPillar(PBK, BK_N, eio(seg(t, 1.8, 3.0)));
  PJT.grp.visible = t >= 6.2; growPillar(PJT, JT_N, eio(seg(t, 6.2, 8.0)));
  post.dof.focus = dist; post.dof.aper = dist * (t < 1.4 ? 3.5 : 6);
  VU.fade.value = 1;
  post.composer.render();
  g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht);
  mapLabels(t); towers(t); note(t);
  if (Q.has('nosafe')) { g.save(); g.fillStyle = 'rgba(255,0,0,.18)'; g.fillRect(0, SAFE_Y, Wd, 250); g.restore(); }
}

window.DUR = T1 - T0;
window.render = tt => frame(tt + T0);
window.TEXTS = tt => { window.render(tt); return TX.map(o => ({ ...o })); };
window.EV = [{ t: 0.0, k: 'whoosh' }, { t: 1.45, k: 'pin' }, { t: 1.8, k: 'rise' }, { t: 3.4, k: 'whoosh' }, { t: 5.35, k: 'pin' }, { t: 6.2, k: 'rise' }, { t: 7.7, k: 'pin' }]
  .map(e => ({ ...e, t: e.t - T0 })).filter(e => e.t >= 0 && e.t <= T1 - T0);
window.render(0);
window.READY = true;
</script>
