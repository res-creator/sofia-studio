// «Мысленный эксперимент» style lab, direction 2: artistic documentary. Frame-exact: window.render(t) draws time t (s).

const liftAt = t => outC(lin(t, 7.55, 8.2)) * (1 - quint(lin(t, 10.7, 11.55)));

const cv = document.getElementById('gl');

vec3 toLin(vec3 c){return pow(c,vec3(2.2));}

  vec3 c = toLin(s);

  float water = smoothstep(.004,.03, c.b - c.r) * (1. - smoothstep(.10,.22,l));
  vec3 inkA = vec3(.0045,.0068,.0090), inkB = vec3(.020,.032,.038);

const VS_PLANE = `#version 300 es
in vec2 aP; uniform mat4 uMVP; uniform mat4 uView; uniform vec4 uRect; out vec2 vP; out float vDepth;

const FS_MAP = `#version 300 es

  TX.over = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, TX.over);
  for (const [k, vv] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, vv);
  window.READY = true;
}
function bindQuad(p) { const l = gl.getAttribLocation(p.p, 'aP'); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0); }
function useTex(p, name, t, unit) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(p.u[name], unit); }

// ---------- overlay drawing helpers (2D canvas, linear sRGB strokes on top of the photographic layer)
function polyline(ctx, pts, frac = 1, closed = false) {
  if (frac <= 0 || pts.length < 2) return;
  const P = closed ? pts.concat([pts[0]]) : pts;
  let L = 0; const seg = [];
  for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(d); L += d; }
  let rem = L * frac; ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length && rem > 0; i++) {
    if (seg[i - 1] <= rem) { ctx.lineTo(P[i][0], P[i][1]); rem -= seg[i - 1]; }
    else { const k = rem / seg[i - 1]; ctx.lineTo(P[i - 1][0] + (P[i][0] - P[i - 1][0]) * k, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * k); rem = 0; }
  }

}
function splitWrap(pts) { // break a projected ring where it jumps across the screen (antimeridian)
  const out = [[]]; for (let i = 0; i < pts.length; i++) { if (i && Math.abs(pts[i][0] - pts[i - 1][0]) > W * .5) out.push([]); out[out.length - 1].push(pts[i]); } return out;
}
function text(ctx, s, x, y, { font, color, a = 1, track = 0, align = 'left' }) {
  ctx.font = font; ctx.fillStyle = rgba(color, a); ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = track + 'px';
  ctx.textAlign = align; ctx.fillText(s, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}
const fmtLat = l => l === 0 ? '0°' : Math.abs(l) + '°';

function drawOverlay(t, M, plateAmt) {
  const c = octx; c.clearRect(0, 0, W, H); c.lineCap = 'round'; c.lineJoin = 'round';
  const pr = (lon, lat, z = 0) => project(M, lon * D2R, mercY(lat), z);
  // --- plate titling (the 1569 engraving)
  if (plateAmt > 0) {
    const a = smooth(t, .7, 1.5) * (1 - smooth(t, 2.4, 3.0));
    c.strokeStyle = rgba(PARCH, .55 * a); c.lineWidth = 1;
    const x0 = 128, y0 = 812;
    c.beginPath(); c.moveTo(x0, y0 - 64); c.lineTo(x0 + 300 * outC(lin(t, .7, 1.8)), y0 - 64); c.stroke();
    text(c, 'Карта мира Меркатора', x0, y0, { font: 'italic 500 50px Serif', color: PARCH, a: a * .95 });
    text(c, '1569  ·  ДУЙСБУРГ  ·  ДЛЯ МОРЕПЛАВАТЕЛЕЙ', x0, y0 + 44, { font: '400 18px Mono', color: PARCH, a: a * .85, track: 2.4 });
  }
  if (t < 2.4) return;
  // --- graticule: hairlines drawn from the equator outward, 10° steps
  const ga = smooth(t, 2.6, 3.6) * (1 - .45 * smooth(t, 11.4, 12.6));
  const lats = [-80, -70, -60, -50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50, 60, 70, 80];
  c.lineWidth = 1;
  for (const la of lats) {
    const f = outQ(lin(t, 2.7 + Math.abs(la) / 80 * .9, 3.9 + Math.abs(la) / 80 * .9)); if (f <= 0) continue;
    const pts = []; for (let lo = -300; lo <= 300; lo += 3) pts.push(pr(lo, la));
    // draw outward from the centre of the frame in both directions
    const mid = pts.reduce((b, p, i) => Math.abs(p[0] - W / 2) < Math.abs(pts[b][0] - W / 2) ? i : b, 0);
    c.strokeStyle = la === 0 ? rgba(PARCH, .42 * ga) : rgba(SLATE, .30 * ga);
    c.lineWidth = la === 0 ? 1.2 : .9;
    polyline(c, pts.slice(mid), f); polyline(c, pts.slice(0, mid + 1).reverse(), f);
  }
  for (let lo = -300; lo <= 300; lo += 10) {
    const f = outQ(lin(t, 2.9 + Math.min(1, Math.abs(lo + 10) / 180) * .7, 4.1 + Math.min(1, Math.abs(lo + 10) / 180) * .7)); if (f <= 0) continue;
    const pts = []; for (let la = 0; la <= 84; la += 2) pts.push(pr(lo, la));
    const pts2 = []; for (let la = 0; la >= -84; la -= 2) pts2.push(pr(lo, la));
    c.strokeStyle = rgba(SLATE, .26 * ga); c.lineWidth = .9;
    polyline(c, pts, f); polyline(c, pts2, f);
  }
  // latitude figures along the left edge, and the equator named
  const la_a = ga * smooth(t, 3.4, 4.2);
  for (const la of lats) {
    const A = pr(-300, la), B = pr(300, la), X = 70;
    if ((A[0] - X) * (B[0] - X) > 0) continue;
    const y = A[1] + (B[1] - A[1]) * (X - A[0]) / (B[0] - A[0]);
    if (y < 40 || y > H - 140) continue;
    text(c, fmtLat(la), X, y - 7, { font: '400 14px Mono', color: la === 0 ? PARCH : SLATE, a: la_a * (la === 0 ? .9 : .75), track: 1 });
    if (la === 0) text(c, 'ЭКВАТОР', X + 36, y - 7, { font: '400 14px Mono', color: PARCH, a: la_a * .8, track: 2.4 });
  }
  // --- coastlines: whisper-thin, so the map reads as a drawn chart over the photograph
  const ca = .18 * smooth(t, 3.2, 4.4) * (1 - .5 * smooth(t, 11.2, 12.4));
  if (ca > 0) {
    c.strokeStyle = rgba(PARCH, ca); c.lineWidth = .8;
    for (const off of [-360, 0, 360]) { const a0 = pr(-180 + off, 0)[0], a1 = pr(180 + off, 0)[0]; if (Math.max(a0, a1) < -50 || Math.min(a0, a1) > W + 50) continue; for (const r of GEO.coast) for (const s of splitWrap(r.map(p => pr(p[0] + off, p[1])))) polyline(c, s); }
  }
  // --- Africa outline + fill
  const afDraw = cubic(lin(t, 4.3, 6.0));
  const afHi = smooth(t, 10.8, 12.0);
  if (afDraw > 0) {
    if (afHi > 0) {
      c.fillStyle = rgba(PARCH, .07 * afHi);
      c.beginPath(); for (const r of GEO.africa_fill) { r.forEach((p, i) => { const q = pr(p[0], p[1]); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath(); } c.fill('nonzero');
    }
    c.strokeStyle = rgba(PARCH, .78 + .2 * afHi); c.lineWidth = 1.5 + .4 * afHi;
    for (const r of GEO.africa_stroke) polyline(c, r.map(p => pr(p[0], p[1])), afDraw);

  // --- Greenland: original outline (becomes a dashed ghost), the lifted copy
  const glDraw = cubic(lin(t, 4.0, 5.6));
  const lift = liftAt(t), tr = travel(t), moved = t > 7.55;
  if (glDraw > 0) {
    c.strokeStyle = rgba(OCHRE, (moved ? .55 : .95)); c.lineWidth = moved ? 1.1 : 1.6;
    if (moved) c.setLineDash([5, 6]);
    for (const r of GEO.greenland) polyline(c, r.map(p => pr(p[0], p[1])), glDraw, true);
    c.setLineDash([]);
  }
  const R = moved ? glRot(tr) : null;
  if (moved) {
    const z = lift * .045;
    c.strokeStyle = rgba(OCHRE, 1); c.lineWidth = 1.7;
    for (const r of GEO.greenland) { const pts = r.map(p => { const q = rotPt(R, p[0], p[1]); return project(M, q[0], q[1], z); }); polyline(c, pts, 1, true); }
  }
  // --- labels
  const glc = moved ? (() => { const q = rotPt(R, C0[0], C0[1]); return project(M, q[0], q[1], lift * .045); })() : pr(C0[0], C0[1]);
  const la1 = smooth(t, 5.0, 5.8) * (1 - smooth(t, 7.3, 7.7)) + smooth(t, 11.6, 12.3);
  // Greenland label: right of the island before the move; in the right column after
  if (t < 8) {
    const a = smooth(t, 5.0, 5.8) * (1 - smooth(t, 6.3, 6.8));
    const p = pr(-8, 77);
    text(c, 'Гренландия', p[0] + 6, p[1], { font: '600 46px Serif', color: OCHRE, a });
    text(c, 'НА КАРТЕ', p[0] + 8, p[1] + 32, { font: '400 16px Mono', color: OCHRE, a: a * .9, track: 2.4 });
  }
  if (t < 8.3) {
    const a = smooth(t, 5.4, 6.2) * (1 - smooth(t, 7.0, 7.6));
    const p = pr(53, 6);
    text(c, 'Африка', p[0] + 10, p[1], { font: '600 46px Serif', color: PARCH, a });
    text(c, 'НА КАРТЕ', p[0] + 12, p[1] + 32, { font: '400 16px Mono', color: PARCH, a: a * .9, track: 2.4 });
  }
  // stretch ladder beside Greenland: the same 5° of latitude get taller toward the pole
  const lad = smooth(t, 6.75, 7.5) * (1 - smooth(t, 8.0, 8.6));
  if (lad > 0) {
    const lon = -4;
    const ys = [50, 55, 60, 65, 70, 75, 80].map(l => [l, pr(lon, l)]);
    c.strokeStyle = rgba(PARCH, .7 * lad); c.lineWidth = 1;
    c.beginPath(); c.moveTo(ys[0][1][0], ys[0][1][1]); c.lineTo(ys[ys.length - 1][1][0], ys[ys.length - 1][1][1]); c.stroke();
    ys.forEach(([l, p], i) => {
      const f = outC(lin(t, 6.75 + i * .07, 7.2 + i * .07));
      const w = l % 10 === 0 ? 16 : 9;
      c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[0] + w * f, p[1]); c.stroke();
      if (l % 10 === 0) text(c, l + '°', p[0] + 24, p[1] + 5, { font: '400 14px Mono', color: PARCH, a: lad * f * .85, track: 1 });
    });
    // the step between 50° and 60° vs 70° and 80° measured (tick brackets)
    const s1 = ys[0][1], s2 = ys[2][1], s3 = ys[4][1], s4 = ys[6][1];
    const h1 = Math.abs(s2[1] - s1[1]), h2 = Math.abs(s4[1] - s3[1]);
    text(c, '×' + (h2 / h1).toFixed(1).replace('.', ','), s3[0] + 70, (s3[1] + s4[1]) / 2 + 6, { font: '400 16px Mono', color: OCHRE, a: lad * smooth(t, 7.0, 7.5), track: 1 });
    c.strokeStyle = rgba(OCHRE, .8 * lad * smooth(t, 7.0, 7.5));
    c.beginPath(); c.moveTo(s3[0] + 56, s3[1]); c.lineTo(s3[0] + 62, s3[1]); c.lineTo(s3[0] + 62, s4[1]); c.lineTo(s3[0] + 56, s4[1]); c.stroke();
  }
  // final: the comparison
  const fa = smooth(t, 11.5, 12.3);
  if (fa > 0) {
    const colX = 1290;
    // leader from the island to the column
    const lp = [glc[0] + 0, glc[1]];
    const ex = colX - 24, ey = 520;
    const lf = cubic(lin(t, 11.5, 12.2));
    c.strokeStyle = rgba(OCHRE, .85 * fa); c.lineWidth = 1;
    c.beginPath(); c.arc(lp[0], lp[1], 3.2, 0, 2 * PI); c.fillStyle = rgba(OCHRE, fa); c.fill();
    c.beginPath(); c.moveTo(lp[0], lp[1]); c.lineTo(lerp(lp[0], ex, lf), lerp(lp[1], ey, lf)); c.stroke();
    text(c, 'Гренландия', colX, ey + 10, { font: '600 46px Serif', color: OCHRE, a: smooth(t, 11.9, 12.5) });
    text(c, '2,17 МЛН КМ²', colX + 2, ey + 42, { font: '400 16px Mono', color: OCHRE, a: smooth(t, 12.1, 12.7) * .9, track: 2.4 });
    const ay = 352, ap = pr(38, 9), alf = cubic(lin(t, 11.3, 12.0));
    c.strokeStyle = rgba(PARCH, .8 * fa); c.fillStyle = rgba(PARCH, fa);
    c.beginPath(); c.arc(ap[0], ap[1], 3.2, 0, 2 * PI); c.fill();
    c.beginPath(); c.moveTo(ap[0], ap[1]); c.lineTo(lerp(ap[0], colX - 24, alf), lerp(ap[1], ay - 14, alf)); c.stroke();
    text(c, 'Африка', colX, ay, { font: '600 46px Serif', color: PARCH, a: smooth(t, 11.7, 12.3) });
    text(c, '30,4 МЛН КМ²', colX + 2, ay + 32, { font: '400 16px Mono', color: PARCH, a: smooth(t, 11.9, 12.5) * .9, track: 2.4 });
    // the ratio: rule + big figure
    const rf = outC(lin(t, 12.5, 13.2));
    c.strokeStyle = rgba(PARCH, .5 * rf); c.beginPath(); c.moveTo(colX, 640); c.lineTo(colX + 380 * rf, 640); c.stroke();
    text(c, '×14', colX - 6, 770, { font: '500 140px Serif', color: PARCH, a: smooth(t, 12.6, 13.3) });
    text(c, 'В ДЕЙСТВИТЕЛЬНОСТИ', colX + 236, 712, { font: '400 16px Mono', color: PARCH, a: smooth(t, 12.9, 13.5) * .7, track: 2.4 });
    text(c, 'АФРИКА БОЛЬШЕ', colX + 236, 738, { font: '400 16px Mono', color: PARCH, a: smooth(t, 12.9, 13.5) * .7, track: 2.4 });
  }
}

// ---------- frame
window.render = function (t) {
  const showPlate = t < 3.6, xf = sine(lin(t, 2.05, 3.45));
  const cm = mapCam(t), M = camMats(cm);
  // map scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.scene.f); gl.viewport(0, 0, W, H);
  gl.clearColor(.006, .008, .010, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.disable(gl.DEPTH_TEST);
  let p = P.map; gl.useProgram(p.p); bindQuad(p);
  gl.uniformMatrix4fv(p.u.uMVP, false, M.mvp); gl.uniformMatrix4fv(p.u.uView, false, M.view);
  gl.uniform4f(p.u.uRect, -3 * PI, -PI, 3 * PI, PI); gl.uniform4f(p.u.uMR, ...GEO.mask);
  gl.uniform1f(p.u.uHole, smooth(t, 7.6, 8.4)); gl.uniform1f(p.u.uSpot, smooth(t, 10.9, 12.2)); gl.uniform4f(p.u.uAR, ...GEO.af_mask); gl.uniform1f(p.u.uFocus, cm.d); gl.uniform1f(p.u.uDof, .55); gl.uniform1f(p.u.uEdge, 1.6);
  gl.uniform1f(p.u.uLight, .85); gl.uniform2f(p.u.uLightPos, -.25 + .35 * sine(lin(t, 0, DUR)), .12 - .1 * sine(lin(t, 0, DUR)));
  useTex(p, 'uSat', TX.sat, 0); useTex(p, 'uMask', TX.mask, 1); useTex(p, 'uAfm', TX.afm, 2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // lifted Greenland: shadow then the cut-out
  if (t > 7.55) {
    const lift = liftAt(t), R = glRot(travel(t));
    const Rgl = [R[0], R[3], R[6], R[1], R[4], R[7], R[2], R[5], R[8]];   // column-major
    p = P.gl; gl.useProgram(p.p);
    const la = gl.getAttribLocation(p.p, 'aLL'); gl.bindBuffer(gl.ARRAY_BUFFER, glMesh.vb); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, glMesh.ib);
    gl.uniformMatrix4fv(p.u.uMVP, false, M.mvp); gl.uniformMatrix3fv(p.u.uRot, false, Rgl); gl.uniform4f(p.u.uMR, ...GEO.mask);
    useTex(p, 'uSat', TX.sat, 0); useTex(p, 'uMask', TX.mask, 1);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(p.u.uAlpha, 1); gl.uniform1f(p.u.uShadow, .55 * lift); gl.uniform1f(p.u.uMaskLod, 4.5); gl.uniform1f(p.u.uLift, 0);
    gl.uniform2f(p.u.uOff, .018 * lift, -.03 * lift);
    if (lift > .01) gl.drawElements(gl.TRIANGLES, glCount, gl.UNSIGNED_INT, 0);
    gl.uniform1f(p.u.uShadow, 0); gl.uniform1f(p.u.uMaskLod, 0); gl.uniform1f(p.u.uLift, lift * .045); gl.uniform2f(p.u.uOff, 0, 0);
    gl.drawElements(gl.TRIANGLES, glCount, gl.UNSIGNED_INT, 0);
    gl.disable(gl.BLEND);
  }
  // plate
  if (showPlate) {
    const pc = plateCam(t), PM = camMats(pc), ps = [1, TX.plateSize[1] / TX.plateSize[0]];
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.plate.f); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    p = P.plate; gl.useProgram(p.p); bindQuad(p);
    gl.uniformMatrix4fv(p.u.uMVP, false, PM.mvp); gl.uniformMatrix4fv(p.u.uView, false, PM.view);
    gl.uniform4f(p.u.uRect, 0, 0, 1, ps[1]); gl.uniform2f(p.u.uPS, 1, ps[1]);
    gl.uniform1f(p.u.uFocus, pc.d); gl.uniform1f(p.u.uDof, .7); gl.uniform1f(p.u.uEdge, 1.4);
    useTex(p, 'uPlate', TX.plate, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawOverlay(t, M, showPlate ? 1 : 0);
  gl.bindTexture(gl.TEXTURE_2D, TX.over); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, over); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  p = P.post; gl.useProgram(p.p); bindQuad(p);
  useTex(p, 'uScene', FB.scene.t, 0); useTex(p, 'uPlateT', FB.plate.t, 1); useTex(p, 'uOver', TX.over, 2); useTex(p, 'uPaper', TX.paper, 3);
  gl.uniform1f(p.u.uX, showPlate ? xf : 1); gl.uniform1f(p.u.uPlateOn, showPlate ? 1 : 0); gl.uniform1f(p.u.uFrame, Math.round(t * 30));

};
window.DUR = DUR;
init().catch(e => { console.error(e.stack || e); throw e; });
</script></body></html>
